---
deployment:
  tasks:
    - export PATH=/usr/local/bin:/usr/bin:/bin
    # 1. Salin file dari folder public di git ke folder public_html cPanel
    - /bin/cp -R public/* /home/procurem/public_html/
    - /bin/cp public/.htaccess /home/procurem/public_html/
    
    # 2. Sesuaikan path autoload dan bootstrap di public_html/index.php secara otomatis
    - sed -i "s|__DIR__.'/../|__DIR__.'/../repositories/production-eproc/|g" /home/procurem/public_html/index.php
    
    # 3. Buat symlink storage agar file PDF dapat diakses via URL (fix 403 pada preview PDF)
    - /usr/local/bin/ea-php83 artisan storage:link --force
    - /bin/cp -R storage/app/public /home/procurem/public_html/storage

    # 4. Jalankan migrasi database
    - /usr/local/bin/ea-php83 artisan migrate --force
    
    # 5. Bersihkan cache di server
    - /usr/local/bin/ea-php83 artisan view:clear
    - /usr/local/bin/ea-php83 artisan config:clear
    - /usr/local/bin/ea-php83 artisan route:clear
